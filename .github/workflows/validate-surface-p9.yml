name: Validate surface part 9
on:
  push:
    branches: [codex/validate-surface-p9]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Upstream reference
        run: |
          git init upstream
          git -C upstream remote add origin https://github.com/NVIDIA-Omniverse/usd-brep
          git -C upstream fetch --depth 1 origin c9c5979f04cea8c38213004d4f04df0dcfb40d05
          git -C upstream checkout --detach FETCH_HEAD
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake g++
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> bin"
          key: trim-validation
          cache-on-failure: true
          cache-workspace-crates: true
      - uses: actions/cache@v4
        id: cpp-cache
        with:
          path: bin/cpp
          key: trim-cpp-${{ runner.os }}-c9c5979-v1
      - name: Build reference
        if: steps.cpp-cache.outputs.cache-hit != 'true'
        run: nice -n 10 harness/cpp/build.sh --jobs 6
      - uses: actions/cache/save@v4
        if: steps.cpp-cache.outputs.cache-hit != 'true'
        with:
          path: bin/cpp
          key: trim-cpp-${{ runner.os }}-c9c5979-v1
      - name: Strict C++ feature lint
        run: nice -n 10 cargo clippy --workspace --all-targets --features difftest/cpp -- -D warnings
      - name: Rust and C++ comparison
        run: |
          nice -n 10 cargo run --profile difftest -p difftest --features cpp -- --unit surface.surface_p9
          nice -n 10 cargo run --profile difftest -p difftest --features cpp -- --unit surface.surface_p9 --perturb
          nice -n 10 cargo run --profile difftest -p difftest --features cpp -- --unit surface.surface_p9
          nice -n 10 cargo run --profile difftest -p difftest --features cpp -- --green
      - name: Required lint and test gates
        run: |
          nice -n 10 cargo fmt --all --check
          nice -n 10 cargo clippy --workspace --all-targets -- -D warnings
          nice -n 10 cargo check -p solidcore --target wasm32-unknown-unknown
          nice -n 10 cargo test -p solidcore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surface-p9-difftest-reports
          path: reports/difftest/




